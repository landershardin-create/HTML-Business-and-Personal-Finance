<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Business Asset Tracker with Depreciation</title>
  <link rel="stylesheet" href="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/Dashboard/modules/biz-assets-style-sheet.css" />
</head>
<body>
<div class="container">
  <h2>Multi-Business Asset Tracker</h2>

  <!-- Business Selector -->
  <label for="businessSelect">Select Business:</label>
  <select id="businessSelect">
    <option value="BusinessA">Business A</option>
    <option value="BusinessB">Business B</option>
    <option value="BusinessC">Business C</option>
  </select>

  <!-- Asset Input Form -->
  <div class="section">
    <h3>Add Asset</h3>
    <label>Asset Tag / Barcode: <input type="text" id="assetTag"></label><br><br>
    <label>Asset Name: <input type="text" id="assetName"></label><br><br>
    <label>Category: <input type="text" id="assetCategory"></label><br><br>
    <label>Value ($): <input type="number" id="assetValue" step="0.01"></label><br><br>
    <label>Depreciation Rate (% per year): <input type="number" id="assetDep" step="0.01"></label><br><br>
    <label>Years in Service: <input type="number" id="assetYears"></label><br><br>
    <button onclick="addAsset()">Add Asset</button>
  </div>
 <!-- Business Filter -->
  <div class="section">
    <h3>Filter by Business</h3>
    <select id="businessFilter" onchange="filterAssets()">
      <option value="">All Businesses</option>
      <option value="BusinessA">Business A</option>
      <option value="BusinessB">Business B</option>
      <option value="BusinessC">Business C</option>
    </select>
  </div>
  
  <!-- Search/Filter Bar -->
  <div class="section">
    <h3>Search Assets</h3>
    <input type="text" id="searchInput" placeholder="Search by tag, name, or category..." onkeyup="filterAssets()">
  </div>

  <!-- Asset Table -->
  <div class="section">
    <h3>Asset Records</h3>
    <table id="assetTable">
      <thead>
        <tr>
          <th>Business</th>
          <th>Asset Tag</th>
          <th>Name</th>
          <th>Category</th>
          <th>Value</th>
          <th>Depreciation Rate</th>
          <th>Annual Depreciation</th>
          <th>Accumulated Depreciation</th>
          <th>Net Book Value</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="totals" id="totals"></div>
  </div>
</div>

<script>
  console.log("✅ Business Asset Tracker JS loaded via HTML successfully");
  <script src="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/Dashboard/modules/js/business-asset-tracker.js"></script>
</script>

</body>
</html>

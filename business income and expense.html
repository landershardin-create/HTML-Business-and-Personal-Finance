<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Business Income & Expense Report</title>
  <link rel="stylesheet" href="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/css/biz-income-and-expense-style-sheet.css" />
</head>
<body>
  <h1>Business Income & Expense Report</h1>

  <!-- Company Selector -->
  <label for="companySelect">Select Company:</label>
  <select id="companySelect" aria-label="Company Selector"></select>

  <!-- Time Range Selector -->
  <label for="timeRangeSelect">Select Time Range:</label>
  <select id="timeRangeSelect" aria-label="Time Range Selector">
    <option value="monthly">Monthly</option>
    <option value="quarterly">Quarterly</option>
    <option value="annual">Annual</option>
  </select>

  <!-- Company Header -->
  <section class="company-header" aria-labelledby="headerCompanyName">
    <h2 id="headerCompanyName">Company Name</h2>
    <p id="headerLocation">City, State</p>
    <p>Type: <span id="headerTypeValue"></span></p>
    <p>Role: <span id="headerRoleValue"></span></p>
  </section>

  <!-- Summary -->
  <div class="summary" id="summary"></div>

  <!-- Report Table -->
  <table id="report">
    <thead>
      <tr>
        <th scope="col">Category</th>
        <th scope="col">Type</th>
        <th scope="col">Amount</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  <!-- Extended Script -->
  console.log("✅ Business Income & Expense HTML initialized");

  // Dynamic JS loader
  function loadScript(path, callback) {
    const script = document.createElement("script");
    script.src = path;
    script.type = "text/javascript";
    script.onload = () => {
      console.log(`✅ Loaded script: ${path}`);
      if (typeof callback === "function") callback();
    };
    script.onerror = () => console.error(`❌ Failed to load script: ${path}`);
    document.body.appendChild(script);
  }

  // Attach event listeners after DOM is ready
  document.addEventListener("DOMContentLoaded", () => {
    const companySelect = document.getElementById("companySelect");
    const timeRangeSelect = document.getElementById("timeRangeSelect");

    if (companySelect) {
      companySelect.addEventListener("change", () => {
        if (typeof updateIncomeExpenseDashboard === "function") {
          updateIncomeExpenseDashboard();
        }
      });
    }

    if (timeRangeSelect) {
      timeRangeSelect.addEventListener("change", () => {
        if (typeof updateIncomeExpenseDashboard === "function") {
          updateIncomeExpenseDashboard();
        }
      });
    }

    // Dynamically load external JS file for business income & expense logic
    loadScript(
      "https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/js/business-income-and-expense.js",
      () => {
        // Initialize dashboard after script loads
        if (typeof updateIncomeExpenseDashboard === "function") {
          updateIncomeExpenseDashboard();
        }
      }
    );
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Business Income & Expense Report</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    h1 { color: #2c3e50; }
    select { margin-top: 1em; padding: 0.5em; font-size: 1em; margin-right: 1em; }
    table { width: 100%; border-collapse: collapse; margin-top: 1em; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f0f0f0; }
    .income { color: green; }
    .expense { color: red; }
    .summary { margin-top: 1em; font-size: 1.2em; }
    .right-align { text-align: right; }
  </style>
</head>
<body>
  <h1>Business Income & Expense Report</h1>

  <!-- Company Selector -->
  <label for="companySelect">Select Company:</label>
  <select id="companySelect"></select>

  <!-- Time Range Selector -->
  <label for="timeRangeSelect">Select Time Range:</label>
  <select id="timeRangeSelect">
    <option value="monthly">Monthly</option>
    <option value="quarterly">Quarterly</option>
    <option value="annual">Annual</option>
  </select>

  <!-- Company Header -->
  <div class="company-header" role="region" aria-label="Company Summary">
    <h2 id="headerCompanyName">Company Name</h2>
    <p id="headerLocation">City, State</p>
    <p id="headerType">Type: <span id="headerTypeValue"></span></p>
    <p id="headerRole">Role: <span id="headerRoleValue"></span></p>
  </div>

  <div class="summary" id="summary"></div>
  <table id="report">
    <thead>
      <tr>
        <th>Category</th>
        <th>Type</th>
        <th>Amount</th>
        <th class="right-align" id="expenseTotalHeader">Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- JavaScript -->
  <script>
    async function loadCompanyManager() {
      try {
        const response = await fetch("https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/data/company-manager.json");
        const companyManager = await response.json();
        populateCompanyOptions(companyManager.companies.filter(c => c.active));
      } catch (error) {
        console.error("Error loading company manager:", error);
      }
    }

    function populateCompanyOptions(companies) {
      const companySelect = document.getElementById("companySelect");
      companySelect.innerHTML = companies
        .map(c => `<option value="${c.key}">${c.name}</option>`)
        .join("");
    }

    // Initialize on page load
    loadCompanyManager();
  </script>

  <script src="https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/js/business-income-and-expense.js"></script>
</body>
</html>

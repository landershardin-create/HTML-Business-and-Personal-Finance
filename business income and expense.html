<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Business Income & Expense Report</title>
  <link rel="stylesheet" href="https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/js/biz-income-and-expense.css" />
</head>
<body>
  <h1>Business Income & Expense Report</h1>

  <!-- Company Selector -->
  <label for="companySelect">Select Company:</label>
  <select id="companySelect" aria-label="Company Selector"></select>

  <!-- Time Range Selector -->
  <label for="timeRangeSelect">Select Time Range:</label>
  <select id="timeRangeSelect" aria-label="Time Range Selector">
    <option value="monthly">Monthly</option>
    <option value="quarterly">Quarterly</option>
    <option value="annual">Annual</option>
  </select>

  <!-- Company Header -->
  <section class="company-header" aria-labelledby="headerCompanyName">
    <h2 id="headerCompanyName">Company Name</h2>
    <p id="headerLocation">City, State</p>
    <p>Type: <span id="headerTypeValue"></span></p>
    <p>Role: <span id="headerRoleValue"></span></p>
  </section>

  <!-- Summary -->
  <div class="summary" id="summary"></div>

  <!-- Report Table -->
  <table id="report">
    <thead>
      <tr>
        <th scope="col">Category</th>
        <th scope="col">Type</th>
        <th scope="col">Amount</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/js/business-income-and-expense.js"></script>
</body>
</html>

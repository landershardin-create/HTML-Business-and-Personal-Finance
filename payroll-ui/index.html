<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Payroll UI - HTML Business & Personal Finance</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      input, button { padding: 8px; margin: 4px; }
      .card { border:1px solid #ddd; padding:12px; margin:8px 0; }
    </style>
  </head>
  <body>
    <h1>Payroll (MVP)</h1>
    <div class="card">
      <h2>Create demo employee</h2>
      <label>Name <input id="name"></label>
      <label>Pay Type <select id="payType"><option>hourly</option><option>salaried</option><option>contractor</option></select></label>
      <label>Rate <input id="rate" value="20"></label>
      <button id="create">Create</button>
      <pre id="out"></pre>
    </div>

    <script>
      const base = '';
      document.getElementById('create').onclick = async () => {
        const name = document.getElementById('name').value || 'Demo';
        const payType = document.getElementById('payType').value;
        const rate = Number(document.getElementById('rate').value || 0);
        const res = await fetch(base + '/employees', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name, payType, payRate: rate }) });
        const json = await res.json();
        document.getElementById('out').textContent = JSON.stringify(json, null, 2);
      };
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debt-to-Equity Calculator</title>
  <!-- Link external CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Debt-to-Equity Ratio Calculator</h2>
    
    <label for="debt">Total Debt ($):</label>
    <input type="number" id="debt" placeholder="Enter your total debt">

    <label for="equity">Total Equity ($):</label>
    <input type="number" id="equity" placeholder="Enter your total equity">

    <button id="calculateBtn">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <!-- Link external JavaScript -->
  <script src="script.js"></script>
</body>
</html>

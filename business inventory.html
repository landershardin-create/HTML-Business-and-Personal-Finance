<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Business Inventory Tracker with History</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 1000px; margin: auto; }
    .section { margin-top: 20px; padding: 15px; border: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    .totals { margin-top: 10px; font-weight: bold; white-space: pre-line; }
  </style>
</head>
<body>
<div class="container">
  <h2>Multi-Business Inventory In/Out Tracker</h2>

  <!-- Business Selector -->
  <label for="businessSelect">Select Business:</label>
  <select id="businessSelect">
    <option value="BusinessA">Business A</option>
    <option value="BusinessB">Business B</option>
    <option value="BusinessC">Business C</option>
  </select>

  <!-- Inventory Input Form -->
  <div class="section">
    <h3>Record Inventory Transaction</h3>
    <label>Barcode/Asset Tag: <input type="text" id="itemTag"></label><br><br>
    <label>Item Name: <input type="text" id="itemName"></label><br><br>
    <label>Quantity: <input type="number" id="itemQty"></label><br><br>
    <label>Price per Unit: <input type="number" id="itemPrice" step="0.01"></label><br><br>
    <label>Transaction Type:</label>
    <select id="transactionType">
      <option value="in">In (Purchase/Restock)</option>
      <option value="out">Out (Sale/Usage)</option>
    </select><br><br>
    <button onclick="recordTransaction()">Record Transaction</button>
  </div>

  <!-- Inventory Table -->
  <div class="section">
    <h3>Inventory Records</h3>
    <table id="inventoryTable">
      <thead>
        <tr>
          <th>Business</th>
          <th>Barcode/Tag</th>
          <th>Item</th>
          <th>Quantity In</th>
          <th>Quantity Out</th>
          <th>Balance</th>
          <th>Unit Price</th>
          <th>Total Value</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="totals" id="totals"></div>
  </div>

  <!-- Transaction History -->
  <div class="section">
    <h3>Transaction History</h3>
    <table id="historyTable">
      <thead>
        <tr>
          <th>Date/Time</th>
          <th>Business</th>
          <th>Barcode/Tag</th>
          <th>Item</th>
          <th>Type</th>
          <th>Quantity</th>
          <th>Unit Price</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script src="https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/js/business-inventory.js"></script>
</body>
</html>

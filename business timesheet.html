<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Multi-Business Timesheet Tracker</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    select, input { margin: 5px; }
    .totals { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Timesheet Tracker
    <!-- Company Header -->
    <div class="company-header" role="region" aria-label="Company Summary">
        <h2 id="headerCompanyName">Company Name</h2>
        <p id="headerLocation">City, State</p>
        <p id="headerType">Type: <span></span></p>
        <p id="headerRole">Role: <span></span></p>
    </div>
  </h2>

  <label for="business">Business:</label>
  <select id="business">
    <option value="biz001">Hardin Holdings</option>
    <option value="biz002">Orenthal Ops</option>
  </select>

  <label for="contributor">Contributor:</label>
  <input type="text" id="contributor" placeholder="Name" />

  <label for="date">Date:</label>
  <input type="date" id="date" />

  <label for="hours">Hours:</label>
  <input type="number" id="hours" step="0.1" />

  <button onclick="addEntry()">Add Entry</button>

  <table id="timesheet">
    <thead>
      <tr>
        <th>Business</th>
        <th>Contributor</th>
        <th>Date</th>
        <th>Hours</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="totals">
    <h3>Totals</h3>
    <p id="weeklyTotal">Weekly: 0 hrs</p>
    <p id="monthlyTotal">Monthly: 0 hrs</p>
    <p id="annualTotal">Annual: 0 hrs</p>
  </div>

  <script src="https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/js/business-timekeeper.js"></script>
</body>
</html>

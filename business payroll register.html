<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Payroll Register</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
  .register { max-width: 1300px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
  h1 { text-align: center; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
  th { background-color: #eee; }
  .summary { font-weight: bold; margin-top: 10px; }
  .deduction-total { font-weight: bold; color: #125; }
  tbody tr:nth-child(even) { background: #f4f4f4; }
</style>
</head>
<body>
<div class="register">

  <h1>Payroll Register</h1>

  <table id="payrollTable">
    <thead>
      <tr>
        <th>Name</th><th>Position</th><th>Period</th>
        <th>Gross Pay</th><th>Social Security</th><th>Medicare</th>
        <th>Federal Tax</th><th>Retirement</th><th>State Tax</th>
        <th>Total Deduction</th><th>Net Pay</th><th>Hours</th><th>OT</th><th>Rate</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="summary" id="summary"></div>

</div>

<!-- Example time keeping table -->
<table id="timeKeeping" style="display:none">
  <tbody>
    <tr><td>Alice</td><td>Guitarist</td><td>Oct 2025</td><td>160</td><td>10</td><td></td></tr>
    <tr><td>Bob</td><td>Percussion</td><td>Oct 2025</td><td>152</td><td>0</td><td>28</td></tr>
  </tbody>
</table>

<!-- Example personnel registry table -->
<table id="personnelRegistry" style="display:none">
  <tbody>
    <tr><td>Alice</td><td>30</td></tr>
    <tr><td>Bob</td><td>28</td></tr>
  </tbody>
</table>

<script>
// Lookup rate from personnel registry
function getRateFromRegistry(name) {
  const rows = document.querySelectorAll("#personnelRegistry tbody tr");
  for (const row of rows) {
    const [empName, rate] = Array.from(row.children).map(td => td.textContent);
    if (empName === name) return parseFloat(rate);
  }
  return 0;
}

// Pull data from time keeping table
function loadTimeKeepingData() {
  const timeRows = document.querySelectorAll("#timeKeeping tbody tr");
  const payrollBody = document.querySelector("#payrollTable tbody");
  payrollBody.innerHTML = "";

  timeRows.forEach(row => {
    const [name, position, period, hours, ot, rateCell] = Array.from(row.children).map(td => td.textContent);

    // Use rate from time keeping if present, else lookup from personnel registry
    let rate = parseFloat(rateCell);
    if (isNaN(rate) || rate === 0) {
      rate = getRateFromRegistry(name);
    }

    // Calculate gross pay (OT at 1.5×)
    const gross = (parseFloat(hours) * rate) + (parseFloat(ot) * rate * 1.5);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${name}</td>
      <td>${position}</td>
      <td>${period}</td>
      <td><input type="number" class="gross" value="${gross.toFixed(2)}" readonly></td>
      <td><input type="number" class="ss" value="0"></td>
      <td><input type="number" class="medicare" value="0"></td>
      <td><input type="number" class="federal" value="0"></td>
      <td><input type="number" class="retirement" value="0"></td>
      <td><input type="number" class="state" value="0"></td>
      <td class="deduction-total">$0.00</td>
      <td class="net">$${gross.toFixed(2)}</td>
      <td>${hours}</td>
      <td>${ot}</td>
      <td>${rate}</td>
    `;
    payrollBody.appendChild(tr);
  });

  recalcTotals();
}

// Calculate deductions + net pay
function calculateRow(row) {
  const gross = parseFloat(row.querySelector(".gross").value) || 0;
  const ss = parseFloat(row.querySelector(".ss").value) || 0;
  const medicare = parseFloat(row.querySelector(".medicare").value) || 0;
  const federal = parseFloat(row.querySelector(".federal").value) || 0;
  const retirement = parseFloat(row.querySelector(".retirement").value) || 0;
  const state = parseFloat(row.querySelector(".state").value) || 0;

  const deduction = ss + medicare + federal + retirement + state;
  const net = gross - deduction;

  row.querySelector(".deduction-total").textContent = `

{deduction.toFixed(2)}`;
  row.querySelector(".net").textContent = `

{net.toFixed(2)}`;
  return net;
}

// Recalculate totals
function recalcTotals() {
  let totalNet = 0;
  document.querySelectorAll("#payrollTable tbody tr").forEach(row => {
    totalNet += calculateRow(row);
  });
  document.getElementById("summary").textContent = `Total Net Pay: $${totalNet.toFixed(2)}`;
}

// Bind events
document.addEventListener("input", e => {
  if (e.target.classList.contains("ss") ||
      e.target.classList.contains("medicare") ||
      e.target.classList.contains("federal") ||
      e.target.classList.contains("retirement") ||
      e.target.classList.contains("state")) {
    recalcTotals();
  }
});

// Initialize
document.addEventListener("DOMContentLoaded", loadTimeKeepingData);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Payroll Register</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
  .register { max-width: 1300px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
  h1 { text-align: center; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
  th { background-color: #eee; }
  .business-header { margin-top: 40px; font-size: 1.2em; color: #333; }
  .summary { font-weight: bold; margin-top: 10px; }
  .company-header { text-align: center; margin-bottom: 20px; }
  #companySelect { margin: 10px auto 30px; display: block; padding: 8px; font-size: 1em; }
  .type-dropdown { width: 130px; }
  .type-custom { width: 110px; display: none; }
  .deduction-total { font-weight: bold; color: #125; }
  tbody tr:nth-child(even) { background: #f4f4f4; }
</style>
</head>
<body>
<div class="register">

  <h1>Payroll Register</h1>

  <!-- Company Header Summary -->
  <div class="company-header" role="region" aria-label="Company Summary">
    <h2 id="headerCompanyName">Company Name</h2>
    <p id="headerLocation">City, State</p>
    <p>Type: <span id="headerType"></span></p>
    <p>Role: <span id="headerRole"></span></p>
  </div>

  <!-- Company Selector -->
  <label for="companySelect"><strong>Select Company:</strong></label>
  <select id="companySelect">
    <option value="acme">Acme Corp</option>
    <option value="zenith">Zenith LLC</option>
  </select>

  <!-- Dynamic Business Section -->
  <div id="businessSection"></div>

</div>

<script>
// Company + Employee Data
const companyData = {
  acme: {
    name: "Acme Corp",
    location: "Nashville, TN",
    type: "Entertainment",
    role: "Music Performance / Production",
    employees: [
      { type: "Employee", name: "Alice", position: "Guitarist", period: "Oct 2025",
        gross: 5000, ss: 150, medicare: 30, federal: 180, retirement: 100, state: 100,
        hours: 160, ot: 10, notes: "Exceeded targets" },
      { type: "Employee", name: "Bob", position: "Floor Percussions", period: "Oct 2025",
        gross: 4500, ss: 130, medicare: 28, federal: 170, retirement: 95, state: 100,
        hours: 152, ot: 0, notes: "-" }
    ]
  },
  zenith: {
    name: "Zenith LLC",
    location: "Atlanta, GA",
    type: "IT Services",
    role: "Analytics & Support",
    employees: [
      { type: "Employee", name: "Dana", position: "Analyst", period: "Oct 2025",
        gross: 4200, ss: 120, medicare: 25, federal: 155, retirement: 80, state: 80,
        hours: 158, ot: 3, notes: "Weekend support" }
    ]
  }
};

// Render company section dynamically
function renderCompany(companyKey) {
  const company = companyData[companyKey];
  document.getElementById("headerCompanyName").textContent = company.name;
  document.getElementById("headerLocation").textContent = company.location;
  document.getElementById("headerType").textContent = company.type;
  document.getElementById("headerRole").textContent = company.role;

  let html = `<div class="business-header">Business: ${company.name}</div>
    <table>
      <thead>
        <tr>
          <th>Type</th><th>Employee Name</th><th>Position</th><th>Pay Period</th>
          <th>Gross Pay</th><th>Social Security</th><th>Medicare</th>
          <th>Federal Tax</th><th>Retirement</th><th>State Tax</th>
          <th>Total Deduction</th><th>Net Pay</th><th>Hours</th><th>OT</th><th>Notes</th>
        </tr>
      </thead>
      <tbody>`;

  let totalNet = 0;
  company.employees.forEach(emp => {
    const deduction = emp.ss + emp.medicare + emp.federal + emp.retirement + emp.state;
    const net = emp.gross - deduction;
    totalNet += net;

    html += `<tr>
      <td>
        <select class="type-dropdown">
          <option ${emp.type==="Employee"?"selected":""}>Employee</option>
          <option ${emp.type==="Contractor"?"selected":""}>Contractor</option>
          <option value="Custom">Custom...</option>
        </select>
        <input class="type-custom" type="text" placeholder="Enter type">
      </td>
      <td>${emp.name}</td><td>${emp.position}</td><td>${emp.period}</td>
      <td>

{emp.gross}</td><td>

{emp.ss}</td><td>

{emp.medicare}</td>
      <td>

{emp.federal}</td><td>

{emp.retirement}</td><td>

{emp.state}</td>
      <td class="deduction-total">

{deduction}</td><td>

{net}</td>
      <td>${emp.hours}</td><td>${emp.ot}</td><td>${emp.notes}</td>
    </tr>`;
  });

  html += `</tbody></table>
    <div class="summary">Total Net Pay: $${totalNet}</div>`;

  document.getElementById("businessSection").innerHTML = html;

  // Rebind custom-type toggle
  document.querySelectorAll(".type-dropdown").forEach(select => {
    select.addEventListener("change", function () {
      const customInput = this.parentElement.querySelector(".type-custom");
      if (this.value === "Custom") {
        customInput.style.display = "inline-block";
        customInput.focus();
      } else {
        customInput.style.display = "none";
      }
    });
  });
}

// Initial load
document.getElementById("companySelect").addEventListener("change", function () {
  renderCompany(this.value);
});
renderCompany("acme");
</script>
</body>
</html>

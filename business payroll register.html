<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Payroll Register</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
  .register { max-width: 1300px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
  h1 { text-align: center; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
  th { background-color: #eee; }
  .summary { font-weight: bold; margin-top: 10px; }
  .deduction-total { font-weight: bold; color: #125; }
  tbody tr:nth-child(even) { background: #f4f4f4; }
</style>
</head>
<body>
<div class="register">

  <h1>Payroll Register</h1>

  <table id="payrollTable">
    <thead>
      <tr>
        <th>Name</th><th>Position</th><th>Period</th>
        <th>Gross Pay</th><th>Social Security</th><th>Medicare</th>
        <th>Federal Tax</th><th>Retirement</th><th>State Tax</th>
        <th>Total Deduction</th><th>Net Pay</th><th>Hours</th><th>OT</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="summary" id="summary"></div>

</div>

<script>
// Pull data from personnel registry table
function loadPersonnelData() {
  const personnelRows = document.querySelectorAll("#personnelRegistry tbody tr");
  const payrollBody = document.querySelector("#payrollTable tbody");
  payrollBody.innerHTML = "";

  personnelRows.forEach(row => {
    const [name, position, period, hours, ot] = Array.from(row.children).map(td => td.textContent);

    // Default payroll values
    const gross = 0, ss = 0, medicare = 0, federal = 0, retirement = 0, state = 0;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${name}</td>
      <td>${position}</td>
      <td>${period}</td>
      <td><input type="number" class="gross" value="${gross}"></td>
      <td><input type="number" class="ss" value="${ss}"></td>
      <td><input type="number" class="medicare" value="${medicare}"></td>
      <td><input type="number" class="federal" value="${federal}"></td>
      <td><input type="number" class="retirement" value="${retirement}"></td>
      <td><input type="number" class="state" value="${state}"></td>
      <td class="deduction-total">$0.00</td>
      <td class="net">$0.00</td>
      <td>${hours}</td>
      <td>${ot}</td>
    `;
    payrollBody.appendChild(tr);
  });

  recalcTotals();
}

// Calculate deductions + net pay
function calculateRow(row) {
  const gross = parseFloat(row.querySelector(".gross").value) || 0;
  const ss = parseFloat(row.querySelector(".ss").value) || 0;
  const medicare = parseFloat(row.querySelector(".medicare").value) || 0;
  const federal = parseFloat(row.querySelector(".federal").value) || 0;
  const retirement = parseFloat(row.querySelector(".retirement").value) || 0;
  const state = parseFloat(row.querySelector(".state").value) || 0;

  const deduction = ss + medicare + federal + retirement + state;
  const net = gross - deduction;

  row.querySelector(".deduction-total").textContent = `

{deduction.toFixed(2)}`;
  row.querySelector(".net").textContent = `

{net.toFixed(2)}`;
  return net;
}

// Recalculate totals
function recalcTotals() {
  let totalNet = 0;
  document.querySelectorAll("#payrollTable tbody tr").forEach(row => {
    totalNet += calculateRow(row);
  });
  document.getElementById("summary").textContent = `Total Net Pay: $${totalNet.toFixed(2)}`;
}

// Bind events
document.addEventListener("input", e => {
  if (e.target.classList.contains("gross") ||
      e.target.classList.contains("ss") ||
      e.target.classList.contains("medicare") ||
      e.target.classList.contains("federal") ||
      e.target.classList.contains("retirement") ||
      e.target.classList.contains("state")) {
    recalcTotals();
  }
});

// Initialize
document.addEventListener("DOMContentLoaded", loadPersonnelData);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Business Journal & Account Manager</title>

  <!-- CSS URL -->
  <link rel="stylesheet" 
    href="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/css/business style sheet.css?raw=true" />

  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
      color: #333;
    }

    header {
      background: #004080;
      color: #fff;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 1rem 2rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      border-bottom: 2px solid #004080;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      color: #004080;
    }

    form {
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    button {
      background: #004080;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #0066cc;
    }

    .charts {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    canvas {
      flex: 1;
      min-width: 300px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1rem;
    }
  </style>
</head>
<body>

  <!-- Professional Header -->
  <header>
    Business Journal & Account Manager
  </header>

  <div class="container">

    <!-- 🏢 Company Header -->
    <div class="company-header">
      <label for="companyHeaderSelect">Active Company:</label>
      <select id="companyHeaderSelect" name="activeCompany">
        <option value="">-- Select Company --</option>
      </select>
    </div>

    <!-- 📘 Journal Manager -->
    <div class="section" id="journalManager">
      <h2>Journal Manager</h2>
      <form id="journalForm">
        <div class="form-group">
          <label for="journalCompany">Company:</label>
          <select id="journalCompany" name="companyId" required>
            <option value="">-- Select Company --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="journalTitle">Journal Title:</label>
          <input type="text" id="journalTitle" name="journalTitle" required />
        </div>

        <div class="form-group">
          <label for="journalDescription">Description:</label>
          <textarea id="journalDescription" name="journalDescription"></textarea>
        </div>

        <button type="submit">Create Journal</button>
      </form>

      <!-- 🧾 Multi-Entry Section -->
      <div id="journalEntries">
        <h3>Journal Entries</h3>
        <form id="entryForm">
          <div class="form-group">
            <label for="entryCompany">Company:</label>
            <select id="entryCompany" name="companyId" required>
              <option value="">-- Select Company --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="linkedAccount">Linked Account:</label>
            <select id="linkedAccount" name="accountId">
              <option value="">-- Select Account --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="entryLabel">Entry Label:</label>
            <input type="text" id="entryLabel" name="entryLabel" required />
          </div>

          <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" required />
          </div>

          <button type="submit">Add Entry</button>
        </form>

        <ul id="journalEntriesList"></ul>
        <div id="companyTotals"></div>
      </div>
    </div>

    <!-- 🧮 Account Manager -->
    <div class="section" id="accountManager">
      <h2>Account Manager</h2>
      <form id="accountForm">
        <div class="form-group">
          <label for="accountCompany">Company:</label>
          <select id="accountCompany" name="companyId" required>
            <option value="">-- Select Company --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="accountName">Account Name:</label>
          <input type="text" id="accountName" name="accountName" required />
        </div>

        <div class="form-group">
          <label for="accountType">Account Type:</label>
          <input type="text" id="accountType" name="accountType" />
        </div>

        <button type="submit">Create Account</button>
      </form>
    </div>

    <!-- 📊 Charts -->
    <h2>Financial Visualizations</h2>
    <div class="charts">
      <canvas id="accountTypeChart" width="400" height="400"></canvas>
      <canvas id="monthlyTotalsChart" width="400" height="400"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Keep your existing JS logic -->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Business Journal & Account Manager</title>
  <link rel="stylesheet" href="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/css/biz-accounting-journal-style-sheet.css" />
</head>
<body>

  <!-- 🔗 Navigation -->
  <nav class="dashboard-nav">
    <ul>
      <li><a href="company-dashboard.html">🏢 Company Manager Dashboard</a></li>
      <li><a href="business-account.html">🧮 Business Account Manager</a></li>
      <li><a href="business-journal.html">📘 Journal Manager</a></li>
    </ul>
  </nav>

  <!-- 🏢 Company Header -->
  <div class="company-header">
    <label for="companyHeaderSelect">Active Company:</label>
    <select id="companyHeaderSelect" name="activeCompany">
      <option value="">-- Select Company --</option>
      <!-- Populated dynamically -->
    </select>
  </div>

  <!-- 📘 Journal Manager -->
  <div class="section" id="journalManager">
    <h2>Journal Manager</h2>
    <form id="journalForm">
      <div class="form-group">
        <label for="journalCompany">Company:</label>
        <select id="journalCompany" name="companyId" required>
          <option value="">-- Select Company --</option>
          <!-- Populated dynamically -->
        </select>
      </div>

      <div class="form-group">
        <label for="journalTitle">Journal Title:</label>
        <input type="text" id="journalTitle" name="journalTitle" required />
      </div>

      <div class="form-group">
        <label for="journalDescription">Description:</label>
        <textarea id="journalDescription" name="journalDescription"></textarea>
      </div>

      <button type="submit">Create Journal</button>
    </form>

    <!-- 🧾 Multi-Entry Section -->
    <div id="journalEntries">
      <h3>Journal Entries</h3>
      <form id="entryForm">
        <div class="form-group">
          <label for="entryCompany">Company:</label>
          <select id="entryCompany" name="companyId" required>
            <option value="">-- Select Company --</option>
            <!-- Populated dynamically -->
          </select>
        </div>

        <div class="form-group">
          <label for="linkedAccount">Linked Account:</label>
          <select id="linkedAccount" name="accountId">
            <option value="">-- Select Account --</option>
            <!-- Dynamically populated -->
          </select>
        </div>

        <div class="form-group">
          <label for="entryLabel">Entry Label:</label>
          <input type="text" id="entryLabel" name="entryLabel" required />
        </div>

        <div class="form-group">
          <label for="amount">Amount:</label>
          <input type="number" id="amount" name="amount" required />
        </div>

        <button type="submit">Add Entry</button>
      </form>

      <!-- Entries list and totals -->
      <ul id="journalEntriesList"></ul>
      <div id="companyTotals"></div>
    </div>
  </div>

  <!-- 🧮 Account Manager -->
  <div class="section" id="accountManager">
    <h2>Account Manager</h2>
    <form id="accountForm">
      <div class="form-group">
        <label for="accountCompany">Company:</label>
        <select id="accountCompany" name="companyId" required>
          <option value="">-- Select Company --</option>
          <!-- Populated dynamically -->
        </select>
      </div>

      <div class="form-group">
        <label for="accountName">Account Name:</label>
        <input type="text" id="accountName" name="accountName" required />
      </div>

      <div class="form-group">
        <label for="accountType">Account Type:</label>
        <input type="text" id="accountType" name="accountType" />
      </div>

      <button type="submit">Create Account</button>
    </form>
  </div>

  <!-- 📊 Charts -->
  <h3>Financial Visualizations</h3>
  <canvas id="accountTypeChart" width="400" height="400"></canvas>
  <canvas id="monthlyTotalsChart" width="400" height="400"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // --- Populate company dropdowns from localStorage ---
    function populateCompanyDropdowns() {
      const companies = JSON.parse(localStorage.getItem('companies')) || [];
      const dropdownIds = ["companyHeaderSelect", "journalCompany", "entryCompany", "accountCompany"];

      dropdownIds.forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;

        select.innerHTML = '<option value="">-- Select Company --</option>';
        companies.forEach(c => {
          const option = document.createElement('option');
          option.value = c.id;
          option.textContent = c.name;
          select.appendChild(option);
        });
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      populateCompanyDropdowns();

      // Restore active company selection
      const activeCompany = localStorage.getItem('activeCompany');
      if (activeCompany) {
        document.getElementById('companyHeaderSelect').value = activeCompany;
        document.getElementById('journalCompany').value = activeCompany;
        document.getElementById('entryCompany').value = activeCompany;
        document.getElementById('accountCompany').value = activeCompany;
      }
    });

    // --- Example renderEntries function (simplified) ---
    function renderEntries(entries) {
      const journalEntriesList = document.getElementById('journalEntriesList');
      const totalsDisplay = document.getElementById('companyTotals');
      journalEntriesList.innerHTML = "";
      totalsDisplay.innerHTML = "";

      const activeCompany = document.getElementById('companyHeaderSelect').value;
      const filtered = entries.filter(entry => !activeCompany || entry.company === activeCompany);

      let grandTotal = 0;
      const typeTotals = {};
      const monthlyTotals = {};

      filtered.forEach(entry => {
        grandTotal += entry.amount;
        typeTotals[entry.accountType] = (typeTotals[entry.accountType] || 0) + entry.amount;

        const li = document.createElement('li');
        li.textContent = `${entry.label} - $${entry.amount.toLocaleString(undefined,{minimumFractionDigits:2})} (${entry.company}, ${entry.accountType}) [${entry.timestamp}]`;
        journalEntriesList.appendChild(li);
      });

      const formattedTotal = grandTotal.toLocaleString(undefined,{minimumFractionDigits:2});
      totalsDisplay.innerHTML = activeCompany
        ? `<strong>Total for ${activeCompany}:

{formattedTotal}</strong><br>`
        : `<strong>All Companies Total: 

{formattedTotal}</strong><br>`;
    }

    // Sync active company selection
    document.getElementById('companyHeaderSelect').addEventListener('change', e => {
      localStorage.setItem('activeCompany', e.target.value);
      const savedEntries = JSON.parse(localStorage.getItem('entries')) || [];
      renderEntries(savedEntries);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Business Journal & Account Manager</title>

  <!-- CSS URL -->
  <link rel="stylesheet" 
    href="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/css/biz-accounting-journal-style-sheet.css?raw=true" />
</head>
<body>

  <!-- 🔗 Navigation -->
  <nav class="dashboard-nav">
    <ul>
      <li><a href="company-dashboard.html">🏢 Company Manager Dashboard</a></li>
      <li><a href="business-account.html">🧮 Business Account Manager</a></li>
      <li><a href="business-journal.html">📘 Journal Manager</a></li>
    </ul>
  </nav>

  <!-- 🏢 Company Header -->
  <div class="company-header">
    <label for="companyHeaderSelect">Active Company:</label>
    <select id="companyHeaderSelect" name="activeCompany">
      <option value="">-- Select Company --</option>
    </select>
  </div>

  <!-- 📘 Journal Manager -->
  <div class="section" id="journalManager">
    <h2>Journal Manager</h2>
    <form id="journalForm">
      <div class="form-group">
        <label for="journalCompany">Company:</label>
        <select id="journalCompany" name="companyId" required>
          <option value="">-- Select Company --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="journalTitle">Journal Title:</label>
        <input type="text" id="journalTitle" name="journalTitle" required />
      </div>

      <div class="form-group">
        <label for="journalDescription">Description:</label>
        <textarea id="journalDescription" name="journalDescription"></textarea>
      </div>

      <button type="submit">Create Journal</button>
    </form>

    <!-- 🧾 Multi-Entry Section -->
    <div id="journalEntries">
      <h3>Journal Entries</h3>
      <form id="entryForm">
        <div class="form-group">
          <label for="entryCompany">Company:</label>
          <select id="entryCompany" name="companyId" required>
            <option value="">-- Select Company --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="linkedAccount">Linked Account:</label>
          <select id="linkedAccount" name="accountId">
            <option value="">-- Select Account --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="entryLabel">Entry Label:</label>
          <input type="text" id="entryLabel" name="entryLabel" required />
        </div>

        <div class="form-group">
          <label for="amount">Amount:</label>
          <input type="number" id="amount" name="amount" required />
        </div>

        <button type="submit">Add Entry</button>
      </form>

      <ul id="journalEntriesList"></ul>
      <div id="companyTotals"></div>
    </div>
  </div>

  <!-- 🧮 Account Manager -->
  <div class="section" id="accountManager">
    <h2>Account Manager</h2>
    <form id="accountForm">
      <div class="form-group">
        <label for="accountCompany">Company:</label>
        <select id="accountCompany" name="companyId" required>
          <option value="">-- Select Company --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="accountName">Account Name:</label>
        <input type="text" id="accountName" name="accountName" required />
      </div>

      <div class="form-group">
        <label for="accountType">Account Type:</label>
        <input type="text" id="accountType" name="accountType" />
      </div>

      <button type="submit">Create Account</button>
    </form>
  </div>

  <!-- 📊 Charts -->
  <h3>Financial Visualizations</h3>
  <canvas id="accountTypeChart" width="400" height="400"></canvas>
  <canvas id="monthlyTotalsChart" width="400" height="400"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    console.log("✅ Business Journal & Account Manager HTML loaded");

    // ---- DYNAMIC JS LOADER ----
    function loadScript(path, callback) {
      const script = document.createElement("script");
      script.src = path;
      script.onload = () => {
        console.log("✅ Loaded script:", path);
        if (callback) callback();
      };
      script.onerror = () => console.error("❌ Failed:", path);
      document.body.appendChild(script);
    }

    // ---- UNIFIED DROPDOWN MANAGER ----
    function syncCompanyDropdowns(dropdownIds, storageKey = "activeCompany") {
      const savedCompany = localStorage.getItem(storageKey);

      // Initialize all dropdowns with saved value
      dropdownIds.forEach(id => {
        const el = document.getElementById(id);
        if (el && savedCompany) {
          el.value = savedCompany;
        }

        // Attach change listener once
        if (el) {
          el.addEventListener("change", e => {
            localStorage.setItem(storageKey, e.target.value);

            // Update all dropdowns to match
            dropdownIds.forEach(otherId => {
              const otherEl = document.getElementById(otherId);
              if (otherEl && otherEl !== el) {
                otherEl.value = e.target.value;
              }
            });

            // Optional: re-render entries for selected company
            const savedEntries = JSON.parse(localStorage.getItem("entries")) || [];
            if (typeof renderEntries === "function") {
              renderEntries(savedEntries);
            }
          });
        }
      });
    }

    // ---- MAIN INITIALIZER ----
    document.addEventListener("DOMContentLoaded", () => {
      console.log("⏳ DOM ready, waiting for business JS...");

      // Load main business logic
      loadScript(
        "https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/main/js/business-accounting-journal.js?raw=true",
        () => {
          console.log("🚀 Business logic available — initializing...");

          if (typeof populateCompanyDropdowns === "function") {
            populateCompanyDropdowns();
          } else {
            console.warn("⚠ populateCompanyDropdowns() not found");
          }

          // ✅ Sync all dropdowns with unified manager
          syncCompanyDropdowns([
            "companyHeaderSelect",
            "journalCompany",
            "entryCompany",
            "accountCompany"
          ]);
        }
      );
    });
  </script>
</body>
</html>

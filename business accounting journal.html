<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Business Journal & Account Manager</title>
  <link rel="stylesheet" href="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/Dashboard/css/biz-accounting-journal-style-sheet.css" />
</head>
<body>

  <!-- 🏢 Company Header -->
  <div class="company-header">
    <label for="companyHeaderSelect">Active Company:</label>
    <select id="companyHeaderSelect" name="activeCompany">
      <option value="">-- Select Company --</option>
      <option value="acme">Acme Corp</option>
      <option value="globex">Globex Inc</option>
      <option value="initech">Initech LLC</option>
    </select>
  </div>

  <!-- 📘 Journal Manager -->
  <div class="section" id="journalManager">
    <h2>Journal Manager</h2>
    <form id="journalForm">
      <div class="form-group">
        <label for="journalCompany">Company:</label>
        <select id="journalCompany" name="companyId" required>
          <option value="">-- Select Company --</option>
          <option value="acme">Acme Corp</option>
          <option value="globex">Globex Inc</option>
        </select>
      </div>

      <div class="form-group">
        <label for="journalTitle">Journal Title:</label>
        <input type="text" id="journalTitle" name="journalTitle" required />
      </div>

      <div class="form-group">
        <label for="journalDescription">Description:</label>
        <textarea id="journalDescription" name="journalDescription"></textarea>
      </div>

      <button type="submit">Create Journal</button>
    </form>

    <!-- 🧾 Multi-Entry Section -->
    <div id="journalEntries">
      <h3>Journal Entries</h3>
      <form id="entryForm">
        <div class="form-group">
          <label for="entryCompany">Company:</label>
          <select id="entryCompany" name="companyId" required>
            <option value="">-- Select Company --</option>
            <option value="acme">Acme Corp</option>
            <option value="globex">Globex Inc</option>
          </select>
        </div>

        <div class="form-group">
          <label for="linkedAccount">Linked Account:</label>
          <select id="linkedAccount" name="accountId">
            <option value="">-- Select Account --</option>
            <!-- Dynamically populated -->
          </select>
        </div>

        <div class="form-group">
          <label for="entryLabel">Entry Label:</label>
          <input type="text" id="entryLabel" name="entryLabel" required />
        </div>

        <div class="form-group">
          <label for="amount">Amount:</label>
          <input type="number" id="amount" name="amount" required />
        </div>

        <button type="submit">Add Entry</button>
      </form>
    </div>
  </div>

  <!-- 🧮 Account Manager -->
  <div class="section" id="accountManager">
    <h2>Account Manager</h2>
    <form id="accountForm">
      <div class="form-group">
        <label for="accountCompany">Company:</label>
        <select id="accountCompany" name="companyId" required>
          <option value="">-- Select Company --</option>
          <option value="acme">Acme Corp</option>
          <option value="globex">Globex Inc</option>
        </select>
      </div>

      <div class="form-group">
        <label for="accountName">Account Name:</label>
        <input type="text" id="accountName" name="accountName" required />
      </div>

      <div class="form-group">
        <label for="accountType">Account Type:</label>
        <input type="text" id="accountType" name="accountType" />
      </div>

      <button type="submit">Create Account</button>
    </form>
  </div>
<!-- Add this in your HTML body where you want the chart -->
<canvas id="accountTypeChart" width="400" height="400"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  let accountTypeChart;

  function renderEntries(entries) {
    journalEntriesList.innerHTML = "";
    totalsDisplay.innerHTML = "";
    const activeCompany = document.getElementById('companyHeaderSelect').value;

    const filtered = entries.filter(entry => !activeCompany || entry.company === activeCompany);

    let grandTotal = 0;
    const typeTotals = {};

    filtered.forEach(entry => {
      grandTotal += entry.amount;
      typeTotals[entry.accountType] = (typeTotals[entry.accountType] || 0) + entry.amount;

      const li = document.createElement('li');
      li.textContent = `${entry.label} - $${entry.amount} (${entry.company}, ${entry.accountType}) [${entry.timestamp}]`;

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = "❌";
      deleteBtn.type = "button";
      deleteBtn.addEventListener('click', () => {
        const confirmDelete = confirm(`Remove entry "${entry.label}" from ${entry.company}?`);
        if (confirmDelete) {
          let savedEntries = JSON.parse(localStorage.getItem('entries')) || [];
          savedEntries = savedEntries.filter(e => e.id !== entry.id);
          localStorage.setItem('entries', JSON.stringify(savedEntries));
          renderEntries(savedEntries);
        }
      });

      li.appendChild(deleteBtn);
      journalEntriesList.appendChild(li);
    });

    // Display totals
    if (activeCompany) {
      totalsDisplay.innerHTML = `<strong>Total for ${activeCompany}:

{grandTotal.toFixed(2)}</strong><br>`;
    } else {
      totalsDisplay.innerHTML = `<strong>All Companies Total: 

{grandTotal.toFixed(2)}</strong><br>`;
    }

    for (const [type, total] of Object.entries(typeTotals)) {
      const p = document.createElement('p');
      p.textContent = `${type}: $${total.toFixed(2)}`;
      totalsDisplay.appendChild(p);
    }

    // Render chart
    const ctx = document.getElementById('accountTypeChart').getContext('2d');
    const labels = Object.keys(typeTotals);
    const data = Object.values(typeTotals);

    if (accountTypeChart) {
      accountTypeChart.destroy(); // Clear old chart
    }

    accountTypeChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: [
            '#4CAF50', '#FF9800', '#2196F3', '#9C27B0', '#F44336'
          ]
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom'
          },
          title: {
            display: true,
            text: activeCompany ? `Breakdown for ${activeCompany}` : 'Breakdown for All Companies'
          }
        }
      }
    });
  }
</script>
  <script src="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/js/business-accounting-journal-tracker.js"></script>
</body>
</html>

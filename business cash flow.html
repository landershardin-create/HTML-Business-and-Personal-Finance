<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Flow Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f8;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .dashboard {
      max-width: 600px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
    .inflow { color: green; }
    .outflow { color: red; }
    .net { color: blue; }
  </style>
</head>
<body>
  <h1>Business Cash Flow Dashboard</h1>

  <div class="dashboard">
    <!-- Drop-down populated from company manager dashboard -->
    <label for="businessSelect">Select Business</label>
    <select id="businessSelect"></select>

    <label for="inflow">Cash Inflows ($)</label>
    <input type="number" id="inflow">

    <label for="outflow">Cash Outflows ($)</label>
    <input type="number" id="outflow">

    <div class="result" id="net"></div>
  </div>

  <script>

  </script>
</body>
</html>

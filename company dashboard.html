<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Manager Dashboard</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .form-group input, .form-group select { display: block; margin: 5px 0; padding: 5px; width: 100%; max-width: 400px; }
    .company-list div, .carousel-card { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    button { margin: 5px; padding: 5px 10px; }
    .company-logo { max-width: 150px; max-height: 150px; display: block; margin: 10px 0; }
  </style>
</head>
<body>
  <section class="filter-export">
    <label for="ownerFilter">Filter by Owner:</label>
    <select id="ownerFilter"><option value="">All Owners</option></select>
    <button id="exportBtn">Export Companies</button>
    <button id="clearBtn">Clear All</button>
    <button id="syncToGitHubBtn">Sync to GitHub</button>
    <button id="loadFromGitHubBtn">Load from GitHub</button>
  </section>

  <section class="carousel-viewer">
    <h3>Company Carousel Viewer</h3>
    <div id="carouselDisplay" class="carousel-card" aria-live="polite"></div>
    <div>
      <button id="prevBtn">Previous</button>
      <button id="nextBtn">Next</button>
    </div>
  </section>

  <section class="company-manager">
    <h3>Manage Companies</h3>
    <form id="companyForm">
      <div class="form-group">
        <input type="text" id="companyName" placeholder="Company name" required />
        <input type="text" id="companyEIN" placeholder="SSN# or EIN#" />
        <input type="text" id="companySEIN" placeholder="State EIN #" />

        <!-- New State Sales Tax field -->
        <input type="text" id="companyStateSalesTax" placeholder="State Sales Tax ID" />

        <!-- Existing Local Sales Tax field -->
        <input type="text" id="companySalesTax" placeholder="Local Sales Tax ID" />

        <!-- Logo Upload -->
        <label for="companyLogo">Upload Company Logo:</label>
        <input type="file" id="companyLogo" accept="image/*" />

        <fieldset>
          <legend>Address</legend>
          <input type="text" id="streetAddress" placeholder="Street Address" />
          <input type="text" id="city" placeholder="City" />
          <input type="text" id="state" placeholder="State" />
          <input type="number" id="zipCode" placeholder="ZIP Code" />
        </fieldset>

        <fieldset id="ownersSection">
          <legend>Owner(s)</legend>
          <div id="ownersContainer"></div>
          <input type="text" id="ownerName" placeholder="Owner name" />
          <button type="button" id="addOwnerBtn">Add Owner</button>
        </fieldset>

        <fieldset id="partnerSection" style="display:none;">
          <legend>Partners</legend>
          <div id="partnersContainer"></div>
          <input type="text" id="partnerName" placeholder="Partner name" />
          <input type="number" id="partnerShare" placeholder="Partner share %" min="0" max="100" />
          <button type="button" id="addPartnerBtn">Add Partner</button>
          <p id="ownershipWarning" style="color:red; display:none;">
            Total partner ownership must equal 100%.
          </p>
        </fieldset>

        <select id="companyRole">
          <option value="RoleType">-Role Type-</option>
          <option value="Viewer">Viewer</option>
          <option value="Editor">Editor</option>
          <option value="Owner">Owner</option>
        </select>

        <select id="companyType">
          <option value="">-Company type-</option>
          <option value="Sole Proprietor">Sole Proprietor</option>
          <option value="Partnership">Partnership</option>
          <option value="LLC">LLC</option>
          <option value="Corporation">Corporation</option>
          <option value="Nonprofit">Nonprofit</option>
        </select>
      </div>
      <button type="submit">Add</button>
    </form>
    <div class="company-list" id="companyList"></div>
  </section>

  <script src="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/main/js/company-dashboard.js"></script>
  <script>
    const companyForm = document.getElementById('companyForm');
    const companyList = document.getElementById('companyList');
    const carouselDisplay = document.getElementById('carouselDisplay');
    let companies = [];
    let currentIndex = 0;

    companyForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const reader = new FileReader();
      const logoFile = document.getElementById('companyLogo').files[0];

      reader.onload = function(event) {
        const company = {
          name: document.getElementById('companyName').value,
          ein: document.getElementById('companyEIN').value,
          sein: document.getElementById('companySEIN').value,
          stateSalesTax: document.getElementById('companyStateSalesTax').value, // NEW FIELD
          salesTax: document.getElementById('companySalesTax').value,
          logo: event.target.result // base64 image
        };
        companies.push(company);

        const div = document.createElement('div');
        div.innerHTML = `<strong>${company.name}</strong><br/>
                         EIN: ${company.ein}<br/>
                         SEIN: ${company.sein}<br/>
                         State Sales Tax ID: ${company.stateSalesTax}<br/>
                         Local Sales Tax ID: ${company.salesTax}<br/>
                         ${company.logo ? `<img src="${company.logo}" class="company-logo"/>` : ''}`;
        companyList.appendChild(div);

        displayCompany(currentIndex);
      };

      if (logoFile) {
        reader.readAsDataURL(logoFile);
      } else {
        reader.onload({ target: { result: null } }); // fallback if no logo
      }
    });

    function displayCompany(index) {
      if (companies.length === 0) {
        carouselDisplay.innerHTML = "No companies added yet.";
        return;
      }
      const company = companies[index];
      carouselDisplay.innerHTML = `<h4>${company.name}</h4>
                                   <p>EIN: ${company.ein}</p>
                                   <p>SEIN: ${company.sein}</p>
                                   <p>State Sales Tax ID: ${company.stateSalesTax}</p>
                                   <p>Local Sales Tax ID: ${company.salesTax}</p>
                                   ${company.logo ? `<img src="${company.logo}" class="company-logo"/>` : ''}`;
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (companies.length > 0) {
        currentIndex = (currentIndex - 1 + companies.length) % companies.length;
        displayCompany(currentIndex);
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (companies.length > 0) {
        currentIndex = (currentIndex + 1) % companies.length;
        displayCompany(currentIndex);
      }
    });
  </script>
</body>
</html>

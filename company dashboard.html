<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Manager Dashboard</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .form-group input, .form-group select { display: block; margin: 5px 0; padding: 5px; width: 100%; max-width: 400px; }
    .company-list div, .carousel-card { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    button { margin: 5px; padding: 5px 10px; }
  </style>
</head>
<body>
  <section class="filter-export">
    <label for="ownerFilter">Filter by Owner:</label>
    <select id="ownerFilter"><option value="">All Owners</option></select>
    <button id="exportBtn">Export Companies</button>
    <button id="clearBtn">Clear All</button>
    <button id="syncToGitHubBtn">Sync to GitHub</button>
    <button id="loadFromGitHubBtn">Load from GitHub</button>
  </section>

  <section class="carousel-viewer">
    <h3>Company Carousel Viewer</h3>
    <div id="carouselDisplay" class="carousel-card" aria-live="polite"></div>
    <div>
      <button id="prevBtn">Previous</button>
      <button id="nextBtn">Next</button>
    </div>
  </section>

  <section class="company-manager">
    <h3>Manage Companies</h3>
    <form id="companyForm">
      <div class="form-group">
        <input type="text" id="companyName" placeholder="Company name" required />
        <input type="text" id="streetAddress" placeholder="Street Address" />
        <input type="text" id="city" placeholder="City" />
        <input type="text" id="state" placeholder="State" />
        <input type="text" id="zipCode" placeholder="ZIP Code" />
        <input type="text" id="companyEIN" placeholder="SSN# or EIN#" />
        <input type="text" id="companySEIN" placeholder="State EIN #" />

        <!-- OWNER SECTION -->
        <div id="ownersSection">
          <h4>Owner</h4>
          <div id="ownersContainer"></div>
          <input type="text" id="Owner" placeholder="Owner name" />
          <button type="button" id="addOwnerBtn">Add Owner</button>
          
          <h5>Partners *use only for company type partnership*</h5>
          <input type="text" id="Partner" placeholder="Partner name" />
          <input type="text" id="PartnerShare" placeholder="Partner share %" />
          <button type="button" id="addPartnerBtn">Add Partner</button>
        </div>
        
        <select id="companyRole">
          <option value="RoleType">-Role Type-</option>
          <option value="Viewer">Viewer</option>
          <option value="Editor">Editor</option>
          <option value="Owner">Owner</option>
        </select>

        <select id="companyType">
          <option value="">-Company type-</option>
          <option value="Sole Proprietor">Sole Proprietor</option>
          <option value="Partnership">Partnership</option>
          <option value="LLC">LLC</option>
          <option value="Corporation">Corporation</option>
          <option value="Nonprofit">Nonprofit</option>
        </select>

        <!-- PARTNER SECTION (ONLY FOR PARTNERSHIP) -->
        <div id="partnerSection" style="display:none;">
          <h4>Partners</h4>
          <div id="partnersContainer"></div>
          <p id="ownershipWarning" style="color:red; display:none;">Total partner ownership must equal 100%.</p>
        </div>

        <button type="submit">Add</button>
      </div>
    </form>

    <div class="company-list" id="companyList"></div>
  </section>

  <script>
    const companies = [];
    let currentIndex = 0;

    const companyForm = document.getElementById('companyForm');
    const companyList = document.getElementById('companyList');
    const carouselDisplay = document.getElementById('carouselDisplay');

    // Add company
    companyForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const companyName = document.getElementById('companyName').value;
      const owner = document.getElementById('Owner').value;

      const company = { name: companyName, owner };
      companies.push(company);

      // Update list
      const div = document.createElement('div');
      div.textContent = `${company.name} (Owner: ${company.owner})`;
      companyList.appendChild(div);

      // Reset form
      companyForm.reset();
    });

    // Carousel navigation
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (companies.length > 0) {
        currentIndex = (currentIndex - 1 + companies.length) % companies.length;
        carouselDisplay.textContent = companies[currentIndex].name;
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (companies.length > 0) {
        currentIndex = (currentIndex + 1) % companies.length;
        carouselDisplay.textContent = companies[currentIndex].name;
      }
    });

    // Add Owner
    document.getElementById('addOwnerBtn').addEventListener('click', () => {
      const ownerName = document.getElementById('Owner').value;
      if (ownerName) {
        const div = document.createElement('div');
        div.textContent = ownerName;
        document.getElementById('ownersContainer').appendChild(div);
        document.getElementById('Owner').value = '';
      }
    });

    // Add Partner
    document.getElementById('addPartnerBtn').addEventListener('click', () => {
      const partnerName = document.getElementById('Partner').value;
      const partnerShare = parseFloat(document.getElementById('PartnerShare').value);
      if (partnerName && partnerShare) {
        const div = document.createElement('div');
        div.textContent = `${partnerName} - ${partnerShare}%`;
        document.getElementById('partnersContainer').appendChild(div);
        document.getElementById('Partner').value = '';
        document.getElementById('PartnerShare').value = '';

        // Ownership validation
        let totalShare = 0;
        document.querySelectorAll('#partnersContainer div').forEach(el => {
          const share = parseFloat(el.textContent.split('-')[1]);
          totalShare += share;
        });
        document.getElementById('ownershipWarning').style.display = (totalShare !== 100) ? 'block' : 'none';
      }
    });

    // Clear all companies
    document.getElementById('clearBtn').addEventListener('click', () => {
      companies.length = 0;
      companyList.innerHTML = '';
      carouselDisplay.textContent = '';
    });

    // Export companies (basic JSON download)
    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(companies));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "companies.json");
      dlAnchor.click();
    });

    // Placeholder GitHub sync/load
    document.getElementById('syncToGitHubBtn').addEventListener('click', () => {
      alert("Sync to GitHub feature not yet implemented.");
    });

    document.getElementById('loadFromGitHubBtn').addEventListener('click', () => {
      alert("Load from GitHub feature not yet implemented.");
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #333;
      padding: 15px;
      color: white;
    }

    .menu-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: bold;
    }

    select {
      padding: 8px;
      font-size: 16px;
      border-radius: 4px;
      border: none;
      background-color: #fff;
      color: #333;
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid #007acc;
    }

    main {
      padding: 20px;
      background-color: white;
      min-height: 300px;
    }

    .loading {
      font-style: italic;
      color: #666;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>
  <header>
    <div class="menu-container">
      <label for="tabMenu">Choose a section:</label>
      <select id="tabMenu" aria-label="Dashboard section selector">
        <option value="businessjournal">Business Journal</option>
        <option value="businessbalancesheet">Business Balance Sheet</option>
        <option value="businesscashflow">Business Cash Flow</option>
        <option value="businessincomeandexpense">Business Income & Expense</option>
        <option value="businessnetworth">Business Net Worth</option>
        <option value="businesspayroll">Business Payroll</option>
        <option value="businesspersonnelregistry">Business Personnel Records</option>
        <option value="timesheet">Timesheet</option>
      </select>
    </div>
  </header>

  <main id="content" aria-live="polite"></main>

<script src="https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/js/business-menu.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Business Balance Sheet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
      background-color: #f9f9f9;
    }
    .company-selector, .period-selector, .subperiod-selector {
      margin-bottom: 1em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      margin-bottom: 2em;
    }
    th, td {
      padding: 0.5em;
      border: 1px solid #ccc;
      text-align: left;
    }
    h2 {
      margin-top: 1em;
    }
    .summary {
      font-weight: bold;
      background-color: #eef;
    }
  </style>
</head>
<body>
  <!-- Dynamic header -->
  <h1 id="reportHeader">Business Balance Sheet Report</h1>

  <!-- Company selector starts empty; populated dynamically -->
  <div class="company-selector">
    <label for="companySelect">Select Companies:</label>
    <select id="companySelect" multiple size="3"></select>
  </div>

  <div class="period-selector">
    <label for="periodSelect">Select Period:</label>
    <select id="periodSelect">
      <option value="monthly">Monthly</option>
      <option value="quarterly">Quarterly</option>
      <option value="annual" selected>Annual</option>
    </select>
  </div>

  <div class="subperiod-selector">
    <label for="subPeriodSelect">Select Subperiod:</label>
    <select id="subPeriodSelect"></select>
  </div>

  <div id="balanceSheetContainer"></div>

  <!-- JavaScript file handles dynamic company loading and rendering -->
  <script src="https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/js/business-balance-sheet.js"></script>

  <!-- Inline bootstrap to load company-manager.json and update header -->
  <script>
    async function loadCompanyManager() {
      try {
        const response = await fetch("https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/data/company-manager.json");
        const companyManager = await response.json();
        const companySelect = document.getElementById("companySelect");
        companySelect.innerHTML = companyManager.companies
          .map(c => `<option value="${c.key}">${c.name}</option>`)
          .join("");

        // Update header whenever selections change
        function updateHeader() {
          const selectedCompanies = Array.from(companySelect.selectedOptions).map(opt => opt.text);
          const period = document.getElementById("periodSelect").value;
          const subPeriod = document.getElementById("subPeriodSelect").value;
          const header = document.getElementById("reportHeader");

          let companyText = selectedCompanies.length > 0 ? selectedCompanies.join(", ") : "Business";
          let periodText = period ? period.charAt(0).toUpperCase() + period.slice(1) : "";
          let subPeriodText = subPeriod ? subPeriod : "";

          header.textContent = `Balance Sheet Report: ${companyText} — ${periodText} ${subPeriodText}`;
        }

        companySelect.addEventListener("change", updateHeader);
        document.getElementById("periodSelect").addEventListener("change", updateHeader);
        document.getElementById("subPeriodSelect").addEventListener("change", updateHeader);

      } catch (err) {
        console.error("Failed to load company manager:", err);
      }
    }
    loadCompanyManager();
  </script>
</body>
</html>

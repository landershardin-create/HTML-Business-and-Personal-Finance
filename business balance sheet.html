<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Business Balance Sheet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
      background-color: #f9f9f9;
    }
    .company-selector, .period-selector, .subperiod-selector {
      margin-bottom: 1em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      margin-bottom: 2em;
    }
    th, td {
      padding: 0.5em;
      border: 1px solid #ccc;
      text-align: left;
      vertical-align: top;
    }
    h2 {
      margin-top: 1em;
    }
    .summary {
      font-weight: bold;
      background-color: #eef;
    }
    /* Conditional styling */
    .assets {
      color: green;
      font-weight: bold;
    }
    .liabilities {
      color: red;
      font-weight: bold;
    }
    .equity {
      color: blue;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Dynamic report header -->
  <h1 id="reportHeader">Business Balance Sheet Report</h1>

  <!-- Company selector populated dynamically -->
  <div class="company-selector">
    <label for="companySelect">Select Companies:</label>
    <select id="companySelect" multiple size="3"></select>
  </div>

  <div class="period-selector">
    <label for="periodSelect">Select Period:</label>
    <select id="periodSelect">
      <option value="monthly">Monthly</option>
      <option value="quarterly">Quarterly</option>
      <option value="annual" selected>Annual</option>
    </select>
  </div>

  <div class="subperiod-selector">
    <label for="subPeriodSelect">Select Subperiod:</label>
    <select id="subPeriodSelect"></select>
  </div>

  <!-- Company header details -->
  <div class="company-header" role="region" aria-label="Company Summary">
    <h2 id="headerCompanyName">Company Name</h2>
    <p id="headerLocation">City, State</p>
    <p id="headerType">Type: <span id="headerTypeValue"></span></p>
    <p id="headerRole">Role: <span id="headerRoleValue"></span></p>
  </div>

<!-- Balance sheet container -->
  <div id="balanceSheetContainer"></div>

  <!-- External JavaScript -->
  <script src="https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/Dashboard/js/business-balance-sheet.jsjs"></script>
</body>
</html>

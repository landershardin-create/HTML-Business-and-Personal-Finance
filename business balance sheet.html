<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Business Balance Sheet</title>
  <!-- External CSS for balance sheet styling -->
  <link rel="stylesheet" href="css/biz balance sheet style sheet.css" />
</head>
<body>
  <!-- Dynamic report header -->
  <h1 id="reportHeader">Business Balance Sheet Report</h1>

  <!-- Report controls grouped semantically -->
  <form id="reportControls">
    <fieldset>
      <legend>Report Options</legend>

      <!-- Company selector populated dynamically -->
      <div class="company-selector">
        <label for="companySelect">Select Companies:</label>
        <select id="companySelect" multiple size="3"></select>
      </div>

      <!-- Period selector -->
      <div class="period-selector">
        <label for="periodSelect">Select Period:</label>
        <select id="periodSelect">
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="annual" selected>Annual</option>
        </select>
      </div>

      <!-- Subperiod selector -->
      <div class="subperiod-selector">
        <label for="subPeriodSelect">Select Subperiod:</label>
        <select id="subPeriodSelect"></select>
      </div>
    </fieldset>
  </form>

  <!-- Company header details -->
  <div class="company-header" role="region" aria-label="Company Summary">
    <h2 id="headerCompanyName">Company Name</h2>
    <p id="headerLocation">City, State</p>
    <p id="headerType">Type: <span id="headerTypeValue"></span></p>
    <p id="headerRole">Role: <span id="headerRoleValue"></span></p>
  </div>

  <!-- Balance sheet container -->
  <div id="balanceSheetContainer" aria-live="polite">
    <table class="balance-sheet">
      <thead>
        <tr>
          <th>Assets</th>
          <th>Liabilities</th>
          <th>Equity</th>
        </tr>
      </thead>
      <tbody id="balanceSheetData">
        <!-- Populated dynamically -->
      </tbody>
    </table>
  </div>

  <!-- Loading indicator -->
  <div id="loading" hidden>Loading...</div>
<script>
(() => {
  console.log("✅ Multi-Business Balance Sheet HTML loaded");

  function safeInvoke(fn, ...args) {
    if (typeof fn === "function") {
      fn(...args);
    } else {
      console.warn("⚠️ Attempted to call an undefined function");
    }
  }

  function loadScript(path, callback) {
    const script = document.createElement("script");
    script.src = path;
    script.type = "text/javascript";
    script.onload = () => {
      console.log(`✅ Loaded script: ${path}`);
      if (typeof callback === "function") callback();
    };
    script.onerror = () => {
      console.error(`❌ Failed to load script: ${path}`);
      // Optional fallback: loadScript("/js/business-balance-sheet.js");
    };
    document.body.appendChild(script);
  }

  function bindButton(id, handler) {
    const btn = document.getElementById(id);
    if (btn) btn.addEventListener("click", () => safeInvoke(handler));
  }

  document.addEventListener("DOMContentLoaded", () => {
    bindButton("clearBalanceBtn", clearAllEntries);
    bindButton("addEntryBtn", addEntry);

    const businessSelect = document.getElementById("businessFilter");
    if (businessSelect) businessSelect.addEventListener("change", () => safeInvoke(filterBalanceSheet));

    const searchInput = document.getElementById("searchInput");
    if (searchInput) searchInput.addEventListener("keyup", () => safeInvoke(filterBalanceSheet));

    document.body.addEventListener("click", e => {
      if (e.target.classList.contains("categoryTab")) {
        safeInvoke(switchCategoryView, e.target.dataset.category);
      }
    });

    const DEFAULT_SCRIPT =
      "https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/js/business-balance-sheet.js";
    loadScript(window.balanceSheetScriptPath || DEFAULT_SCRIPT);
  });
})();

</script>
</body>
</html>

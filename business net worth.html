<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Business Net Worth Report</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    h1 { color: #2c3e50; }
    select { margin-top: 1em; padding: 0.5em; font-size: 1em; margin-right: 1em; }
    table { width: 100%; border-collapse: collapse; margin-top: 1em; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f0f0f0; }
    .asset { color: green; }
    .liability { color: red; }
    .summary { margin-top: 1em; font-size: 1.2em; }
  </style>
</head>
<body>
  <h1>Business Net Worth Report</h1>

  <!-- Company and Period Selectors -->
  <label for="companySelect">Select Company:</label>
  <select id="companySelect">
    <option value="acme">Acme Corp</option>
    <option value="zenith">Zenith LLC</option>
    <option value="nova">Nova Industries</option>
  </select>

  <label for="periodSelect">Select Period:</label>
  <select id="periodSelect">
    <option value="monthly">Monthly</option>
    <option value="quarterly">Quarterly</option>
    <option value="annual">Annual</option>
  </select>

  <!-- Company Header -->
  <div class="company-header" role="region" aria-label="Company Summary">
    <h2 id="headerCompanyName">Company Name</h2>
    <p id="headerLocation">City, State</p>
    <p id="headerType">Type: <span></span></p>
    <p id="headerRole">Role: <span></span></p>
  </div>

  <div class="summary" id="summary"></div>
  <table id="report">
    <thead>
      <tr>
        <th>Account</th>
        <th>Type</th>
        <th>Balance</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="https://landershardin-create.github.io/HTML-Business-and-Personal-Finance/js/business-net-worth.js"></script>
</body>
</html>

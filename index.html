<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business and Personal Finance Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    #content {
      padding: 20px;
    }
    .dropdown-container details {
      margin-bottom: 8px;
    }
    .dropdown-container button {
      display: inline-block;
      margin: 4px 0;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="dropdown-container">
    <!-- menus unchanged -->
    <details>
      <summary>Support</summary>
      <button onclick="loadTab('readme')">Read Me</button>
    </details>
  </div>

  <div id="content">Loading...</div>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const sources = {
      modules: 'https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/main/modules/',
      dashboard: 'https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/main/'
    };

    const tabs = {
      welcome: { file: 'welcome.html', base: 'modules' },
      // … other modules …
      readme: { file: 'README.md', base: 'dashboard' }
    };

    function loadTab(tabName) {
      const tab = tabs[tabName];
      if (!tab) {
        document.getElementById('content').innerHTML = `<p>Tab "${tabName}" not found.</p>`;
        return;
      }

      const url = sources[tab.base] + tab.file;

      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
          return response.text();
        })
        .then(text => {
          if (tab.file.endsWith('.md')) {
            document.getElementById('content').innerHTML = marked.parse(text);
          } else {
            document.getElementById('content').innerHTML = text;
          }
        })
        .catch(err => {
          document.getElementById('content').innerHTML = `<p>Error loading ${tabName}: ${err.message}</p>`;
          console.error(err);
        });
    }

    window.onload = () => loadTab('welcome');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Tabbed Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .tab-container {
      display: flex;
      background-color: #333;
    }
    .tab {
      padding: 14px 20px;
      cursor: pointer;
      color: white;
      border: none;
      background: none;
      outline: none;
    }
    .tab:hover {
      background-color: #555;
    }
    .tab.active {
      background-color: #007acc;
    }
    #content {
      padding: 20px;
    }
    .dropdown-container details {
      margin-bottom: 8px;
    }
    .dropdown-container button {
      display: block;
      margin: 4px 0;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="dropdown-container">
    <details>
      <summary>Home</summary>
      <button onclick="loadTab(event, 'welcome')">Welcome</button>
    </details>

    <details>
      <summary>Business Menu</summary>
      <button onclick="loadTab(event, 'businessassets')">Assets</button>
      <button onclick="loadTab(event, 'businessbalsheet')">Balance Sheet</button>
      <button onclick="loadTab(event, 'companydashboard')">Company Manager</button>
      <button onclick="loadTab(event, 'businesscashflow')">Cash Flow</button>
      <button onclick="loadTab(event, 'businessdebttoequity')">Debt to Equity</button>
      <button onclick="loadTab(event, 'businessincomeexpense')">Income & Expense</button>
      <button onclick="loadTab(event, 'businessinventory')">Inventory</button>
      <button onclick="loadTab(event, 'businessjournal')">Journal</button>
      <button onclick="loadTab(event, 'businessnetworth')">Net Worth</button>
      <button onclick="loadTab(event, 'businesspayroll')">Payroll Register</button>
      <button onclick="loadTab(event, 'businesspersonnel')">Personnel Records</button>
      <button onclick="loadTab(event, 'businesstimekeeping')">Timesheet</button>
    </details>

    <details>
      <summary>Contributor Menu</summary>
      <button onclick="loadTab(event, 'contributordashboard')">Onboarding</button>
    </details>

    <details>
      <summary>Personal Menu</summary>
      <button onclick="loadTab(event, 'personalassets')">Assets</button>
      <button onclick="loadTab(event, 'personalbalsheet')">Balance Sheet</button>
      <button onclick="loadTab(event, 'personalcashflow')">Cash Flow</button>
      <button onclick="loadTab(event, 'personalincomeexpense')">Income & Expense</button>
      <button onclick="loadTab(event, 'personaljournal')">Journal</button>
      <button onclick="loadTab(event, 'personalnetworth')">Net Worth</button>
      <button onclick="loadTab(event, 'personalprofile')">Profile Info.</button>
    </details>
    
    <details>
      <summary>Support</summary>
      <button onclick="loadTab(event, 'readme')">Read Me</button>
    </details>
  </div>

  <div id="content">Loading...</div>

  <script>
    const sources = {
      modules: 'https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/modules/',
      dashboard: 'https://raw.githubusercontent.com/landershardin-create/HTML-Business-and-Personal-Finance/dashboard/'
    };

    const tabs = {
      // Modules
      welcome: { file: 'welcome.html', base: 'modules' },
      businessassets: { file: 'business assets.html', base: 'modules' },
      businessbalsheet: { file: 'business balance sheet.html', base: 'modules' },
      businesscashflow: { file: 'business cash flow.html', base: 'modules' },
      companydashboard: { file: 'company dashboard.html', base: 'modules' },
      businessdebttoequity: { file: 'business debt-to-equity.html', base: 'modules' },
      businessincomeexpense: { file: 'business income and expense.html', base: 'modules' },
      businessinventory: { file: 'business inventory.html', base: 'modules' },
      businessjournal: { file: 'business accounting journal.html', base: 'modules' },
      businessnetworth: { file: 'business net worth.html', base: 'modules' },
      businesspayroll: { file: 'business payroll register.html', base: 'modules' },
      businesspersonnel: { file: 'business personnel registry.html', base: 'modules' },
      businesstimekeeping: { file: 'business timesheet.html', base: 'modules' },
      contributordashboard: { file: 'contributor-dashboard.html', base: 'modules' },
      personalassets: { file: 'personal assets.html', base: 'modules' },
      personalbalsheet: { file: 'personal balance sheet.html', base: 'modules' },
      personalcashflow: { file: 'personal cash flow.html', base: 'modules' },
      personalincomeexpense: { file: 'personal income and expense.html', base: 'modules' },
      personalnetworth: { file: 'personal net worth.html', base: 'modules' },
      personaljournal: { file: 'personal accounting journal.html', base: 'modules' },
      personalprofile: { file: 'personal dashboard.html', base: 'modules' },

      // Dashboard
      readme: { file: 'README.md', base: 'dashboard' }
    };

    function loadTab(event, tabName) {
      const tab = tabs[tabName];
      if (!tab) {
        document.getElementById('content').innerHTML = `<p>Tab "${tabName}" not found.</p>`;
        return;
      }

      const url = sources[tab.base] + tab.file;

      // Optional: highlight active tab
      document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
      if (event?.target?.classList.contains('tab')) {
        event.target.classList.add('active');
      }

      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
          return response.text();
        })
        .then(html => {
          document.getElementById('content').innerHTML = html;
        })
        .catch(err => {
          document.getElementById('content').innerHTML = `<p>Error loading ${tabName} tab.</p>`;
          console.error(err);
        });
    }

    // Load default tab on page load
    window.onload = () => loadTab(null, 'welcome');
  </script>
</body>
</html>
